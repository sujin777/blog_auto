name: Daily Auto Blog Publisher (Self-Hosted Runner)

on:
  schedule:
    # 매일 한국 시간(KST) 오전 6시 00분 실행 (UTC 21:00)
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 콘솔 또는 API 수동 즉시 실행 지원

jobs:
  build-and-publish:
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Credentials and Session from Local Workspace
        shell: powershell
        run: |
          Write-Host "[1/3] Checking local credentials and Naver session..."
          if (Test-Path "C:/DEV/261025_blog_auto/.env") {
            Write-Host "Syncing .env from C:/DEV/261025_blog_auto/.env"
            Copy-Item "C:/DEV/261025_blog_auto/.env" . -Force
          }
          if (Test-Path "C:/DEV/261025_blog_auto/.agents/skills/publish-to-naver/naver_session.json") {
            Write-Host "Syncing naver_session.json from local dev"
            New-Item -ItemType Directory -Force -Path ".agents/skills/publish-to-naver" | Out-Null
            Copy-Item "C:/DEV/261025_blog_auto/.agents/skills/publish-to-naver/naver_session.json" ".agents/skills/publish-to-naver/naver_session.json" -Force
          }

      - name: Run Full Auto Pipeline on Domestic IP
        env:
          APIFY_TOKEN_REDDIT: ${{ secrets.APIFY_TOKEN_REDDIT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u auto_pipeline.py

      - name: Persist Refreshed Session Back to Local Workspace
        if: always()
        shell: powershell
        run: |
          if (Test-Path ".agents/skills/publish-to-naver/naver_session.json") {
            Copy-Item ".agents/skills/publish-to-naver/naver_session.json" "C:/DEV/261025_blog_auto/.agents/skills/publish-to-naver/naver_session.json" -Force
            Write-Host "Persisted updated naver_session.json back to C:/DEV/261025_blog_auto"
          }
