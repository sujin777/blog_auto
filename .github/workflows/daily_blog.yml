name: Daily Auto Blog Publisher (100% Cloud Server)

on:
  schedule:
    # 매일 아침 7시 00분 정기 무인 자동 실행 (KST 07:00 = UTC 22:00)
    # 컴퓨터가 완전히 꺼져 있어도 GitHub 클라우드 서버가 100% 독립 실행합니다.
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹 콘솔 수동 즉시 실행 지원

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Korean Fonts and System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install Node.js Dependencies
        run: |
          npm install

      - name: Reconstruct Environment and Naver Session
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN_REDDIT: ${{ secrets.APIFY_TOKEN_REDDIT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PASSWORD: ${{ secrets.NAVER_PASSWORD }}
          NAVER_BLOG_ID: ${{ secrets.NAVER_BLOG_ID }}
          NAVER_SESSION_BASE64: ${{ secrets.NAVER_SESSION_BASE64 }}
        run: |
          mkdir -p output
          mkdir -p .agents/skills/publish-to-naver

          # .env 파일 재구성
          cat <<EOF > .env
          GEMINI_API_KEY=${GEMINI_API_KEY}
          APIFY_TOKEN_REDDIT=${APIFY_TOKEN_REDDIT}
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          NAVER_ID=${NAVER_ID}
          NAVER_PASSWORD=${NAVER_PASSWORD}
          NAVER_BLOG_ID=${NAVER_BLOG_ID}
          EOF

          # 네이버 인증 세션 복원
          if [ -n "${NAVER_SESSION_BASE64}" ]; then
            echo "${NAVER_SESSION_BASE64}" | base64 -d > .agents/skills/publish-to-naver/naver_session.json
            echo "Naver session restored from GitHub Secrets successfully."
          fi

      - name: Run Full Auto Pipeline on Cloud
        run: |
          python -u auto_pipeline.py

      - name: Upload Artifacts on Failure or Completion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-blog-output
          path: output/
          retention-days: 7
